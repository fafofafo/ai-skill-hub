<!DOCTYPE html>
<html><head><meta charset="utf-8">
<script>p5.disableFriendlyErrors = true;</script>
<script src="p5.min.js"></script>
<style>html,body{margin:0;padding:0;overflow:hidden}canvas{display:block}</style>
</head><body>
<script>
// ============ musicvideo 可视化特效模板 (图片+频谱柱) ============
// 由 make_music_video.py viz-render 生成: 注入 __TL(频谱JSON) + __IMGS(图片列表) + __CFG(参数)
const TL = window.__TL;
const W = 880, H = 1184, FPS = 30;
const IMGS = (window.__IMGS && window.__IMGS.length) ? window.__IMGS : ['img1.png','img2.png'];
// 每张图展示时长 = 歌长/图片数(默认), 可用 cfg SWITCH_T 覆盖
const SWITCH_T = (window.__CFG && window.__CFG.SWITCH_T) ? window.__CFG.SWITCH_T : (TL.duration / IMGS.length);

// 可调参数(默认值 = 字幕白字黑边样式)
const __C = Object.assign({
  BAR_COUNT: 44, BAR_W: 14, BAR_MAXH: 150, BAR_SENS: 1.1, BAR_ATTACK: 0.6, BAR_DECAY: 0.35,
  BAR_Y_OFF: 14, SUB_R: 250, SUB_G: 234, SUB_B: 217, GLOW_A: 140, BORDER: 3, BLUR: 5,
  TITLE: ''
}, window.__CFG || {});
const BAR_COUNT = __C.BAR_COUNT, BAR_W = __C.BAR_W, BAR_MAXH = __C.BAR_MAXH;
const BAR_SENS = __C.BAR_SENS, BAR_ATTACK = __C.BAR_ATTACK, BAR_DECAY = __C.BAR_DECAY;
const BAR_Y = H - __C.BAR_Y_OFF;
const BAR_GAP = (W - BAR_COUNT*BAR_W) / (BAR_COUNT-1);

let imgs = [], fade = 1;
let barLevels = new Array(BAR_COUNT).fill(0);
let nativeImgs = [];

function preload() {
  for (const f of IMGS) {
    imgs.push(loadImage(f));
    const ni = new Image(); ni.src = f; nativeImgs.push(ni);
  }
}
function setup() {
  createCanvas(W, H); pixelDensity(1);
  colorMode(HSB, 360, 100, 100, 100);
  randomSeed(11); noiseSeed(11);
  noLoop(); window._p5Ready = true;
}

function specRow(t) {
  const idx = Math.min(TL.spec.length-1, Math.max(0, Math.floor(t / TL.spec_hop_s)));
  return TL.spec[idx] || TL.spec[0];
}
function beatAt(t) { return TL.beats.some(b => Math.abs(b - t) < 0.06); }
function pv(v) { return Math.sqrt(Math.min(1, Math.max(0, v))); }
function bandE(spec, lo, hi) {
  const a = Math.max(0, Math.floor(lo/32*TL.n_bands));
  const b = Math.min(TL.n_bands-1, Math.ceil(hi/32*TL.n_bands));
  let s = 0; for (let i=a;i<=b;i++) s += pv(spec[i]);
  return s / (b-a+1);
}

function draw() {
  const t = frameCount / FPS;
  const spec = specRow(t);
  const low = bandE(spec, 0, 4), mid = bandE(spec, 8, 16);
  const isBeat = beatAt(t);

  // 图片切换(交叉淡化: 前图保持, 后图淡入, 过渡 2s 无硬切)
  const phase = (t % SWITCH_T) / SWITCH_T;
  const fadeDur = 2.0 / SWITCH_T;   // 2s 过渡(占每段比例)
  let fadeIn = 1, fadeOut = 1;
  if (phase < fadeDur) { fadeIn = phase / fadeDur; fadeOut = 1; }
  else if (phase > 1 - fadeDur) { fadeIn = 1; fadeOut = (1 - phase) / fadeDur; }
  else { fadeIn = 1; fadeOut = 1; }
  fade = Math.min(fadeIn, fadeOut);
  const imgIdx = Math.floor(t / SWITCH_T) % IMGS.length;
  const prevIdx = (imgIdx - 1 + IMGS.length) % IMGS.length;

  // ===== 主图: 原生 ctx.drawImage 精确铺满全屏(交叉淡化) =====
  const ctx = drawingContext;
  const ni = nativeImgs[imgIdx];
  const pni = nativeImgs[prevIdx];
  ctx.globalAlpha = 1;
  // 前图(淡出) —— 用户 2026-10-23: 开场第一张(imgIdx=0)不做淡入淡出, 直接全显
  if (pni && pni.complete && pni.naturalWidth > 0 && phase < fadeDur && imgIdx !== 0) {
    ctx.globalAlpha = (1 - phase / fadeDur);
    ctx.drawImage(pni, 0, 0, W, H);
  }
  // 后图(淡入/常驻) —— 开场第一张(imgIdx=0)直接全显, 不淡入
  ctx.globalAlpha = (phase < fadeDur && imgIdx !== 0 ? phase / fadeDur : 1);
  if (ni && ni.complete && ni.naturalWidth > 0) ctx.drawImage(ni, 0, 0, W, H);
  ctx.globalAlpha = 1;

  // ===== 频谱柱: 白字黑边样式 + 泛光 =====
  const gctx = drawingContext;
  for (let b=0; b<BAR_COUNT; b++) {
    const specIdx = Math.floor(b * 32 / BAR_COUNT);
    const target = Math.min(1.2, pv(spec[specIdx] || 0) * BAR_SENS);
    barLevels[b] = target > barLevels[b]
      ? barLevels[b] + (target-barLevels[b])*BAR_ATTACK
      : barLevels[b] + (target-barLevels[b])*BAR_DECAY;
  }
  colorMode(RGB, 255);
  noStroke();
  // 泛光层
  gctx.save();
  gctx.filter = 'blur(' + __C.BLUR + 'px)';
  fill(__C.SUB_R, __C.SUB_G, __C.SUB_B, __C.GLOW_A);
  for (let b=0; b<BAR_COUNT; b++) {
    const hgt = Math.min(BAR_MAXH, barLevels[b] * BAR_MAXH);
    if (hgt > 1) rect(b*(BAR_W+BAR_GAP)-__C.BORDER, BAR_Y-hgt-__C.BORDER, BAR_W+__C.BORDER*2, hgt+__C.BORDER*2);
  }
  gctx.restore();
  // 黑色描边层
  fill(0, 0, 0, 255);
  for (let b=0; b<BAR_COUNT; b++) {
    const hgt = Math.min(BAR_MAXH, barLevels[b] * BAR_MAXH);
    if (hgt > 1) rect(b*(BAR_W+BAR_GAP)-__C.BORDER, BAR_Y-hgt-__C.BORDER, BAR_W+__C.BORDER*2, hgt+__C.BORDER*2);
  }
  // 主体色层(字幕白)
  fill(__C.SUB_R, __C.SUB_G, __C.SUB_B, 255);
  for (let b=0; b<BAR_COUNT; b++) {
    const hgt = Math.min(BAR_MAXH, barLevels[b] * BAR_MAXH);
    if (hgt > 1) rect(b*(BAR_W+BAR_GAP), BAR_Y-hgt, BAR_W, hgt);
  }
  colorMode(HSB, 360, 100, 100, 100);

  // ===== 标题(可选) =====
  if (__C.TITLE) {
    noStroke(); textAlign(CENTER, CENTER);
    fill(320, 90, 76 + low*30);
    textSize(34); textStyle(BOLD);
    text(__C.TITLE, W/2, 80);
  }
  textSize(13); textStyle(NORMAL);
  fill(0,0,100, 55);
  text(t.toFixed(1)+'s', W-90, H-6);
}
</script></body></html>
